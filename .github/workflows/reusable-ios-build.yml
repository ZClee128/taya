name: Reusable iOS Build Pipeline

on:
  workflow_call:
    inputs:
      project_name:
        description: 'Xcode project path (e.g., taya.xcodeproj)'
        required: true
        type: string
      scheme_name:
        description: 'Xcode scheme name'
        required: true
        type: string
      bundle_id:
        description: 'App Bundle ID'
        required: true
        type: string
      provisioning_profile_name:
        description: 'Provisioning Profile name'
        required: true
        type: string
      configuration:
        description: 'Build configuration'
        required: false
        type: string
        default: 'Release'
      xcode_version:
        description: 'Xcode version'
        required: false
        type: string
        default: 'latest-stable'
      upload_to_appstore:
        description: 'Upload to App Store Connect'
        required: false
        type: boolean
        default: true
      service_module_script:
        description: 'Path to service module generation script'
        required: false
        type: string
        default: 'scripts/advanced_obfuscate.py'
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: true
      P12_PASSWORD:
        required: true
      BUILD_PROVISION_PROFILE_BASE64:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
      TEAM_ID:
        required: true
      APPLE_ID:
        required: true
      APP_SPECIFIC_PASSWORD:
        required: false
      API_KEY_ID:
        required: false
      API_ISSUER_ID:
        required: false
      API_PRIVATE_KEY:
        required: false

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
      - name: 🌐 Check Build Environment
        run: |
          echo "Checking public IP..."
          curl -s https://ipinfo.io/json || echo "⚠️ Unable to reach ipinfo.io"

      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version }}
      
      - name: 📦 Generate Service Modules
        run: |
          echo "Generating app service modules..."
          
          if [ -f "${{ inputs.service_module_script }}" ]; then
            python3 ${{ inputs.service_module_script }}
            
            BUNDLE_FILE=$(find . -name "AppServiceBundle.swift" -type f | head -1)
            if [ -n "$BUNDLE_FILE" ]; then
              BUNDLE_SIZE=$(wc -c < "$BUNDLE_FILE" | tr -d ' ')
              echo "✓ AppServiceBundle.swift generated (${BUNDLE_SIZE} bytes)"
            else
              echo "⚠️ AppServiceBundle.swift not found, skipping"
            fi
          else
            echo "⚠️ Service module script not found: ${{ inputs.service_module_script }}"
            echo "Skipping service module generation"
          fi
      
      - name: 🧹 Clean Build Environment
        run: |
          echo "🔍 Cleaning build environment..."
          
          # Clean project and workspace xcuserdata
          echo "Cleaning xcuserdata..."
          
          if [ -d "*.xcodeproj/xcuserdata" ]; then
            rm -rf *.xcodeproj/xcuserdata
            echo "  ✓ Cleaned *.xcodeproj/xcuserdata"
          fi
          
          if [ -d "*.xcodeproj/project.xcworkspace/xcuserdata" ]; then
            rm -rf *.xcodeproj/project.xcworkspace/xcuserdata
            echo "  ✓ Cleaned *.xcodeproj/project.xcworkspace/xcuserdata"
          fi
          
          if [ -d "*.xcworkspace/xcuserdata" ]; then
            rm -rf *.xcworkspace/xcuserdata
            echo "  ✓ Cleaned *.xcworkspace/xcuserdata"
          fi
          
          # Recursive cleanup
          echo "Cleaning all xcuserdata directories..."
          find . -name "xcuserdata" -type d -print -exec rm -rf {} + 2>/dev/null || true
          
          # Clean DerivedData
          echo "Cleaning DerivedData..."
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          
          # Clean build directory
          echo "Cleaning build directory..."
          rm -rf build/
          
          # Clean .DS_Store
          echo "Cleaning .DS_Store..."
          find . -name ".DS_Store" -type f -delete 2>/dev/null || true
          
          # Clean Xcode user-specific files
          echo "Cleaning Xcode user files..."
          find . -name "*.pbxuser" -type f -delete 2>/dev/null || true
          find . -name "*.mode1v3" -type f -delete 2>/dev/null || true
          find . -name "*.perspectivev3" -type f -delete 2>/dev/null || true
          find . -name "*.xcuserstate" -type f -delete 2>/dev/null || true
          
          # Verify cleanup
          echo ""
          echo "📊 Verification:"
          
          TOTAL_XCUSERDATA=$(find . -name "xcuserdata" -type d 2>/dev/null | wc -l | tr -d ' ')
          XCUSERSTATE_COUNT=$(find . -name "*.xcuserstate" -type f 2>/dev/null | wc -l | tr -d ' ')
          
          echo "  xcuserdata dirs: $TOTAL_XCUSERDATA"
          echo "  xcuserstate files: $XCUSERSTATE_COUNT"
          
          if [ "$TOTAL_XCUSERDATA" -eq "0" ] && [ "$XCUSERSTATE_COUNT" -eq "0" ]; then
            echo ""
            echo "✅ Cleanup verified - no user-specific files found"
          else
            echo ""
            echo "⚠️ Warning: residual files detected, performing final cleanup..."
            find . -name "xcuserdata" -type d -exec rm -rf {} + 2>/dev/null || true
            find . -name "*.xcuserstate" -type f -delete 2>/dev/null || true
          fi
          
          echo ""
          echo "✓ Build environment cleaned"
      
      - name: 🔐 Import Certificates and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          PROVISION_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PROVISION_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROVISION_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          
          echo "✓ Certificates and profile imported"
      
      - name: 📝 Get Provisioning Profile UUID
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          echo "PP_UUID=$UUID" >> $GITHUB_ENV
          echo "Found UUID: $UUID"
      
      - name: 🏗️ Build Archive
        run: |
          echo "Starting archive build..."
          
          ARCHIVE_PATH="$RUNNER_TEMP/app.xcarchive"
          
          xcodebuild archive \
            -project ${{ inputs.project_name }} \
            -scheme ${{ inputs.scheme_name }} \
            -configuration ${{ inputs.configuration }} \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            APP_PROFILE="${{ env.PP_UUID }}" \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}"
          
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> $GITHUB_ENV
          
          if [ -d "$ARCHIVE_PATH" ]; then
            echo "✓ Archive created"
          else
            echo "❌ Archive creation failed!"
            exit 1
          fi
      
      - name: 📤 Export IPA
        run: |
          EXPORT_PATH="$RUNNER_TEMP/export"
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"
          
          cat > "$EXPORT_OPTIONS_PATH" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${{ secrets.TEAM_ID }}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ inputs.bundle_id }}</key>
                  <string>${{ inputs.provisioning_profile_name }}</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF
          
          echo "EXPORT_PATH=$EXPORT_PATH" >> $GITHUB_ENV
          
          xcodebuild -exportArchive \
            -archivePath "${{ env.ARCHIVE_PATH }}" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$EXPORT_PATH"
          
          echo "✓ IPA exported"
          ls -lh "$EXPORT_PATH"/*.ipa
      
      - name: 🔍 Validate IPA Content
        run: |
          IPA_FILE=$(find $RUNNER_TEMP/export -name "*.ipa" -type f | head -1)
          TEMP_DIR=$(mktemp -d)
          unzip -q "$IPA_FILE" -d "$TEMP_DIR"
          
          echo "Validating IPA content..."
          
          PROFILE=$(find "$TEMP_DIR" -name "embedded.mobileprovision" | head -1)
          if [ -f "$PROFILE" ]; then
            security cms -D -i "$PROFILE" > "$TEMP_DIR/profile.plist"
            
            if /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$TEMP_DIR/profile.plist" > /dev/null 2>&1; then
              echo "❌ Profile contains device list! Use a Distribution certificate."
              exit 1
            else
              echo "✓ Profile validation passed"
            fi
          fi
          
          rm -rf "$TEMP_DIR"

      - name: 🔍 Binary Privacy Scan
        run: |
          IPA_FILE=$(find $RUNNER_TEMP/export -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "❌ IPA file not found"
            exit 1
          fi
          
          TEMP_DIR=$(mktemp -d)
          echo "Scanning IPA binary: $IPA_FILE"
          unzip -q "$IPA_FILE" -d "$TEMP_DIR"
          
          APP_PATH=$(find "$TEMP_DIR/Payload" -name "*.app" | head -1)
          APP_NAME=$(basename "$APP_PATH" .app)
          BINARY_PATH="$APP_PATH/$APP_NAME"
          
          echo "Scanning binary: $APP_NAME"
          
          if [ -f "$BINARY_PATH" ]; then
             echo "🔍 Checking for sensitive strings..."
             
             FOUND_SENSITIVE=0
             
             if strings "$BINARY_PATH" | grep -i "lizhicong" > /dev/null; then
                 echo "❌ Critical: found sensitive identifier 'lizhicong' in binary!"
                 FOUND_SENSITIVE=1
             fi
             
             if strings "$BINARY_PATH" | grep -i "zclee520" > /dev/null; then
                 echo "❌ Critical: found sensitive identifier 'zclee520' in binary!"
                 FOUND_SENSITIVE=1
             fi
             
             if [ "$FOUND_SENSITIVE" -eq "1" ]; then
                 echo "❌ Build failed: binary contains personal identifiers."
                 echo "This typically happens with absolute paths or Debug configuration."
                 exit 1
             else
                 echo "✅ Privacy scan passed: no sensitive identifiers found."
             fi
          else
             echo "⚠️ Warning: could not locate binary, skipping scan."
          fi
          
          rm -rf "$TEMP_DIR"
      
      - name: 📤 Upload to App Store Connect
        if: ${{ inputs.upload_to_appstore }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.API_PRIVATE_KEY }}
        run: |
          IPA_FILE=$(find ${{ env.EXPORT_PATH }} -name "*.ipa" -type f | head -1)
          
          echo "Preparing to upload to App Store Connect..."
          
          if [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER_ID" ] && [ -n "$API_PRIVATE_KEY" ]; then
            echo "🔑 Using API Key authentication (recommended)"
            
            mkdir -p ~/.private_keys
            
            if echo "$API_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
              echo "🔑 Detected PEM format private key"
              echo "$API_PRIVATE_KEY" > ~/.private_keys/AuthKey_${API_KEY_ID}.p8
            else
              echo "🔑 Detected Base64 encoded private key, decoding..."
              echo "$API_PRIVATE_KEY" | base64 --decode > ~/.private_keys/AuthKey_${API_KEY_ID}.p8
            fi
            
            if [ ! -s ~/.private_keys/AuthKey_${API_KEY_ID}.p8 ]; then
               echo "❌ Private key file is empty or decode failed. Check API_PRIVATE_KEY secret."
               exit 1
            fi

            echo "🚀 Starting upload (API Key mode)..."
            xcrun altool --upload-app \
              --file "$IPA_FILE" \
              --type ios \
              --apiKey "$API_KEY_ID" \
              --apiIssuer "$API_ISSUER_ID" \
              --verbose
              
            rm -f ~/.private_keys/AuthKey_${API_KEY_ID}.p8
            
          elif [ -n "$APPLE_ID" ] && [ -n "$APP_SPECIFIC_PASSWORD" ]; then
            echo "⚠️ No API Key found, falling back to Apple ID + App-Specific Password"
            
            echo "🚀 Starting upload (Legacy mode)..."
            xcrun altool --upload-app \
              --file "$IPA_FILE" \
              --type ios \
              --username "$APPLE_ID" \
              --password "$APP_SPECIFIC_PASSWORD" \
              --verbose
          else
            echo "❌ Error: no upload credentials configured (API Key or Apple ID)"
            exit 1
          fi
          
          echo "✓ Upload process completed"
      
      - name: 📦 Save IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.scheme_name }}-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          retention-days: 7
        if: always()
      
      - name: 🧹 Cleanup Temporary Files
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/build_certificate.p12
          rm -f $RUNNER_TEMP/build_pp.mobileprovision
          echo "✓ Cleanup complete"
